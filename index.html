<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <title>Team Inspire | Rate Calculator</title>
    <style>
        :root { --bg: #f9fafb; --card: #ffffff; --border: #e2e8f0; --text: #111827; --primary: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); padding: 16px 16px 180px 16px; }
        
        #pinScreen { position: fixed; inset: 0; background: var(--text); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .pin-box { background: white; padding: 32px; border-radius: 16px; width: 100%; max-width: 320px; text-align: center; }
        .pin-input { width: 100%; text-align: center; font-size: 2rem; padding: 12px; border: 2px solid var(--border); border-radius: 8px; margin-bottom: 16px; outline: none; }
        
        #appContent { display: none; max-width: 500px; margin: 0 auto; gap: 16px; flex-direction: column; }
        .brand { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 2px solid var(--border); }
        .brand img { width: 45px; height: 45px; object-fit: contain; }
        .brand h1 { font-size: 1rem; font-weight: 800; text-transform: uppercase; }
        
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .card-title { font-size: 0.75rem; font-weight: 800; color: var(--text); margin-bottom: 16px; text-transform: uppercase; }
        .input-group { margin-bottom: 12px; }
        label { font-size: 0.75rem; font-weight: 600; color: #6b7280; display: block; margin-bottom: 4px; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; }
        
        .drawer { max-height: 0; overflow: hidden; transition: 0.3s; }
        .drawer.open { max-height: 500px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }

        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 20px; border-top: 1px solid var(--border); z-index: 99; }
        .btn-row { display: flex; gap: 12px; }
        button { flex: 1; padding: 16px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
        .btn-pdf { background: var(--text); color: white; }
        .btn-quote { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div id="pinScreen"><div class="pin-box"><input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••"><button class="pin-btn" style="width:100%; padding:16px; background:var(--primary); color:white; border:none; border-radius:8px; font-weight:700;" onclick="verify()">UNLOCK</button></div></div>

<div id="appContent">
    <header class="brand"><img src="IMG_20260521_093428.jpg" alt="Logo"><div><h1>TEAM INSPIRE</h1><span>Rate Calculator</span></div></header>
    
    <div class="card">
        <div class="card-title">Interior Pages</div>
        <div class="input-group"><label>Quantity</label><input type="number" id="qty" value="100"></div>
        <div class="input-group"><label>Total Pages</label><input type="number" id="pages" value="100"></div>
    </div>

    <div class="card">
        <label><input type="checkbox" id="hasColor" onchange="toggle('colorDrawer')"> Include Color Inserts</label>
        <div id="colorDrawer" class="drawer"><div class="input-group"><label>Color Pages Count</label><input type="number" id="colorPages" value="0"></div></div>
    </div>

    <div class="card">
        <div class="card-title">Cover & Finishing</div>
        <div class="input-group"><label>Size</label><select id="coverSize"><option value="10">A5</option><option value="20">A4</option></select></div>
        <div class="input-group"><label>Lamination (Production Only)</label><select id="lamination"><option>None</option><option>Matte</option><option>Glossy</option></select></div>
    </div>
</div>

<div class="bottom-bar" id="bottomBar" style="display:none;">
    <div style="font-size: 1.5rem; font-weight: 800; margin-bottom: 16px;" id="grandTotal">₹0</div>
    <div class="btn-row"><button class="btn-pdf" onclick="generatePDF()">PDF</button><button class="btn-quote" onclick="share()">QUOTE</button></div>
</div>

<script>
    function verify() { if(document.getElementById('pinInput').value === "1234") { document.getElementById('pinScreen').style.display = 'none'; document.getElementById('appContent').style.display = 'flex'; document.getElementById('bottomBar').style.display = 'block'; } }
    function toggle(id) { document.getElementById(id).classList.toggle('open'); calculate(); }
    function calculate() {
        let q = parseInt(document.getElementById('qty').value) || 0;
        let p = parseInt(document.getElementById('pages').value) || 0;
        let total = (q * (p * 0.5)) + (parseInt(document.getElementById('coverSize').value) || 0);
        document.getElementById('grandTotal').innerText = "₹" + total;
    }
    document.querySelectorAll('input, select').forEach(i => i.addEventListener('input', calculate));
    function generatePDF() { html2pdf().set({ html2canvas: { scale: 2 } }).from(document.getElementById('appContent')).save('Quotation.pdf'); }
    function share() { alert("Share functionality ready."); }
</script>
</body>
</html>
