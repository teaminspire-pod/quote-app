<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <title>Inspire | Enterprise Rate System</title>
    <style>
        :root { --bg: #f3f4f6; --card: #ffffff; --border: #d1d5db; --text: #111827; --primary: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); padding: 16px; color: var(--text); padding-bottom: 150px; }
        .brand { border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        .card-label { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-bottom: 16px; color: #6b7280; }
        .field { margin-bottom: 12px; }
        label { font-size: 0.75rem; font-weight: 600; margin-bottom: 4px; display: block; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; }
        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 20px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .total { font-size: 1.75rem; font-weight: 800; }
        button { padding: 14px 28px; background: var(--primary); color: white; border: none; border-radius: 4px; font-weight: 700; }
    </style>
</head>
<body>

<header class="brand"><h1>ENTERPRISE RATE CALCULATOR</h1></header>

<main>
    <div class="card">
        <div class="card-label">Interior Specifications</div>
        <div class="field"><label>Qty</label><input type="number" id="qty" value="100"></div>
        <div class="field"><label>B/W Pages</label><input type="number" id="bwPages" value="100"></div>
        <div class="field"><label>GSM</label><select id="gsm"><option value="0.32">70 GSM</option><option value="0.36">80 GSM</option><option value="0.38">100 GSM</option><option value="0.40">120 GSM</option></select></div>
    </div>

    <div class="card">
        <label><input type="checkbox" id="useColor" onchange="calc()"> Include Colour Inserts</label>
        <div id="colorArea" style="margin-top:10px; display:none;">
            <div class="field"><label>Colour Pages</label><input type="number" id="colPages" value="0"></div>
            <div class="field"><label>Size</label><select id="colSize"><option value="2.50">A5</option><option value="4.00">A4</option></select></div>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="total" id="total">₹0</div>
    <button onclick="share()">QUOTE</button>
</footer>

<script>
    function toggle(id) { document.getElementById(id).style.display = document.getElementById('useColor').checked ? 'block' : 'none'; calc(); }
    document.getElementById('useColor').onchange = () => toggle();

    function calc() {
        let q = parseInt(document.getElementById('qty').value) || 0;
        let p = parseInt(document.getElementById('bwPages').value) || 0;
        let g = parseFloat(document.getElementById('gsm').value) || 0;
        let bwCost = q * p * g;
        
        let colorCost = 0;
        if(document.getElementById('useColor').checked) {
            let cp = parseInt(document.getElementById('colPages').value) || 0;
            let cs = parseFloat(document.getElementById('colSize').value) || 0;
            colorCost = q * cp * cs;
        }
        
        document.getElementById('total').innerText = "₹" + (bwCost + colorCost).toLocaleString();
    }
    document.querySelectorAll('input, select').forEach(i => i.addEventListener('input', calc));

    function share() {
        let text = `*Team Inspire Quotation*\nTotal: ${document.getElementById('total').innerText}`;
        window.location.href = `https://wa.me/?text=${encodeURIComponent(text)}`;
    }
</script>
</body>
</html>
