<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Team Inspire | Quotation Engine</title>
    <style>
        :root { --bg-color: #FAFAF9; --card-bg: #FFFFFF; --border: #E2E8F0; --input-bg: #F8FAFC; --text-main: #1E293B; --text-muted: #64748B; --primary: #E11D48; --accent: #0F172A; --offset-color: #3B82F6; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        ::-webkit-scrollbar { display: none; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px 12px 200px 12px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background-color 0.4s ease; -ms-overflow-style: none; scrollbar-width: none; }
        body.offset-mode { background-color: #EFF6FF; }
        #appContent { display: flex; max-width: 600px; margin: 0 auto; flex-direction: column; gap: 16px; }
        .card { background-color: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px -5px rgba(0,0,0,0.04); }
        .main-header { display: flex; justify-content: space-between; align-items: flex-end; padding: 12px 4px; margin-bottom: 4px; }
        .main-header h1 { font-size: 1.25rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: -0.5px; }
        .offset-mode .main-header h1 { color: var(--offset-color); }
        .reset-btn { background: none; border: none; color: var(--text-muted); font-weight: 800; font-size: 0.75rem; cursor: pointer; text-transform: uppercase; }
        .card-header { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; font-weight: 800; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-header svg { stroke: var(--accent); width: 18px; height: 18px; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .floating-input { position: relative; width: 100%; }
        .floating-input input { width: 100%; padding: 22px 14px 8px 14px; border: 2px solid var(--border); border-radius: 12px; font-size: 1.05rem; font-weight: 700; color: var(--text-main); background-color: var(--input-bg); transition: all 0.2s ease; appearance: none; outline: none; }
        .floating-input label { position: absolute; top: 16px; left: 14px; color: var(--text-muted); font-weight: 800; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; pointer-events: none; transition: all 0.2s; }
        .floating-input input:focus ~ label, .floating-input input:not(:placeholder-shown) ~ label { top: 6px; font-size: 0.65rem; color: var(--primary); }
        .input-title { font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 8px;}
        .segmented-control { display: flex; gap: 4px; width: 100%; background: var(--input-bg); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
        .segmented-control input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; }
        .segment-btn { flex: 1; text-align: center; padding: 10px 2px; background: transparent; border-radius: 8px; font-weight: 700; font-size: 0.9rem; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
        input[type="radio"]:checked + label.segment-btn { background: var(--card-bg); color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid var(--border); }
        .checkbox-group { display: flex; align-items: center; padding: 12px 0; cursor: pointer; }
        .checkbox-group input { width: 22px; height: 22px; margin-right: 14px; accent-color: var(--primary); cursor: pointer; }
        .checkbox-group label { margin-bottom: 0; font-size: 1rem; font-weight: 700; color: var(--accent); cursor: pointer; }
        .dim-toggle { background: var(--input-bg); border: 1px solid var(--border); font-size: 0.7rem; font-weight: 800; color: var(--text-muted); border-radius: 6px; padding: 6px 10px; cursor: pointer; text-transform: uppercase; }
        .size-hint { font-size: 0.75rem; color: var(--primary); font-weight: 700; text-align: center; margin-top: 8px; }
        .drawer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s; margin-top: 0; }
        .drawer-inner { overflow: hidden; opacity: 0; transition: opacity 0.3s; }
        .drawer.open { grid-template-rows: 1fr; margin-top: 8px; }
        .drawer.open .drawer-inner { opacity: 1; padding-top: 8px; }
        .standard-input { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 12px; font-size: 0.95rem; font-weight: 700; background: var(--input-bg); }
        #invoiceCard { border: 2px solid var(--primary); border-radius: 16px; padding: 20px; margin-bottom: 20px; transition: border 0.3s; }
        #invoiceCard.inactive { border-color: var(--border); background: transparent; }
        .invoice-section-title { font-weight: 800; color: var(--accent); margin: 16px 0; border-bottom: 1px dashed var(--border); font-size: 0.7rem; text-transform: uppercase; }
        .invoice-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .invoice-row .name { color: var(--text-muted); font-size: 0.85rem; }
        .invoice-row .cost { font-weight: 800; font-size: 0.9rem; }
        .bottom-action-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(250, 250, 249, 0.9); backdrop-filter: blur(20px); border-top: 1px solid var(--border); padding: 16px; z-index: 100; }
        .grand-total-value { font-size: 2rem; font-weight: 800; color: var(--accent); }
        .btn-share { width: 100%; background-color: var(--accent); color: white; padding: 16px; border-radius: 12px; font-weight: 800; cursor: pointer; }
        .btn-share:disabled { background-color: var(--border); }
    </style>
</head>
<body>

<div id="appContent">
    <header class="main-header">
        <h1>Quotation Engine</h1>
        <button onclick="resetApp()" class="reset-btn">Clear Form</button>
    </header>

    <form id="quoteForm" onsubmit="event.preventDefault();">
        <div class="card">
            <h2 class="card-header">1. Dimensions</h2>
            <div class="form-grid">
                <div class="floating-input"><input type="number" id="bookQty" min="1" placeholder=" " autofocus><label>Book Quantity (MOQ: 4)</label></div>
                <div>
                    <div class="input-header"><span class="input-title">Book Size</span><button type="button" class="dim-toggle" onclick="toggleDimFormat()" id="dimFormatBtn">Unit: CM</button></div>
                    <div class="segmented-control">
                        <input type="radio" id="sizeA4" name="masterSize" value="A4"><label for="sizeA4" class="segment-btn">A4</label>
                        <input type="radio" id="sizeA5" name="masterSize" value="A5" checked><label for="sizeA5" class="segment-btn">A5</label>
                        <input type="radio" id="sizeA6" name="masterSize" value="A6"><label for="sizeA6" class="segment-btn">A6</label>
                    </div>
                    <div class="size-hint" id="sizeHintDisplay">14 x 21.5 CM</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="card-header">2. Inner Core</h2>
            <div class="form-grid">
                <div class="floating-input"><input type="number" id="innerPages" min="1" placeholder=" "><label>Total Inner Pages</label></div>
                <div>
                    <span class="input-title">Paper Material</span>
                    <div class="segmented-control" style="margin-bottom: 6px;">
                        <input type="radio" id="typeNS" name="paperType" value="Natural Shade (NS)" checked><label for="typeNS" class="segment-btn">NS</label>
                        <input type="radio" id="typeMap" name="paperType" value="Maplitho"><label for="typeMap" class="segment-btn">Maplitho</label>
                    </div>
                    <div class="segmented-control">
                        <input type="radio" id="gsm70" name="paperGsm" value="70" checked><label for="gsm70" class="segment-btn">70</label>
                        <input type="radio" id="gsm80" name="paperGsm" value="80"><label for="gsm80" class="segment-btn">80</label>
                        <input type="radio" id="gsm100" name="paperGsm" value="100"><label for="gsm100" class="segment-btn">100</label>
                        <input type="radio" id="gsm120" name="paperGsm" value="120"><label for="gsm120" class="segment-btn">120</label>
                    </div>
                </div>
                <div>
                    <span class="input-title">Printing</span>
                    <div class="segmented-control">
                        <input type="radio" id="printBw" name="printType" value="Printed" checked><label for="printBw" class="segment-btn">Black & White</label>
                        <input type="radio" id="printPlain" name="printType" value="Plain"><label for="printPlain" class="segment-btn">Plain</label>
                    </div>
                </div>
                <label class="checkbox-group"><input type="checkbox" id="toggleColour" onchange="toggleDrawer('colourDrawer', this.checked)"><span>Add Colour Pages</span></label>
                <div id="colourDrawer" class="drawer"><div class="drawer-inner"><div class="floating-input"><input type="number" id="colorPages" min="0" placeholder=" "><label>Colour Pages Count</label></div></div></div>
            </div>
        </div>

        <div class="card">
            <h2 class="card-header">3. Exterior Layer</h2>
            <div class="form-grid">
                <div>
                    <span class="input-title">Binding Style</span>
                    <div class="segmented-grid" style="grid-template-columns: 1fr 1fr;">
                        <input type="radio" id="bindPerfect" name="bindingStyle" value="Perfect Binding" checked><label for="bindPerfect" class="segment-btn">Perfect</label>
                        <input type="radio" id="bindSpiral" name="bindingStyle" value="Spiral Binding"><label for="bindSpiral" class="segment-btn">Spiral</label>
                        <input type="radio" id="bindStaple" name="bindingStyle" value="Centre Stapling"><label for="bindStaple" class="segment-btn">Stapling</label>
                        <input type="radio" id="bindHard" name="bindingStyle" value="Hardbinding"><label for="bindHard" class="segment-btn">Hardbound</label>
                    </div>
                </div>
                <div>
                    <span class="input-title">Cover Paper</span>
                    <div class="segmented-control">
                        <input type="radio" id="cover250" name="coverGsm" value="250 GSM" checked><label for="cover250" class="segment-btn">250 GSM</label>
                        <input type="radio" id="cover300" name="coverGsm" value="300 GSM"><label for="cover300" class="segment-btn">300 GSM</label>
                    </div>
                </div>
                <div>
                    <span class="input-title">Lamination</span>
                    <div class="segmented-control">
                        <input type="radio" id="lamMatt" name="lamination" value="Matt" checked><label for="lamMatt" class="segment-btn">Matt</label>
                        <input type="radio" id="lamGlossy" name="lamination" value="Glossy"><label for="lamGlossy" class="segment-btn">Glossy</label>
                    </div>
                </div>
                <label class="checkbox-group"><input type="checkbox" id="emergencyCharge" onchange="triggerDebounce()"><span>Emergency Priority (+25%)</span></label>
            </div>
        </div>

        <div class="card">
            <h2 class="card-header">4. Pre-Press Services</h2>
            <label class="checkbox-group"><input type="checkbox" id="toggleDesign" onchange="toggleDrawer('designDrawer', this.checked)"><span>Enable Design Support</span></label>
            <div id="designDrawer" class="drawer">
                <div class="drawer-inner">
                    <label class="checkbox-group"><input type="checkbox" id="coverDesign" onchange="triggerDebounce()"><span>Cover Design</span></label>
                    <div class="form-grid" style="grid-template-columns: 1fr 1fr; gap: 8px;">
                        <div><span class="standard-label">Custom Design (Pgs)</span><input type="number" id="designPages" class="standard-input" placeholder="0"></div>
                        <div><span class="standard-label">Basic Layout (Pgs)</span><input type="number" id="layoutPages" class="standard-input" placeholder="0"></div>
                        <div><span class="standard-label">DTP (Pgs)</span><input type="number" id="dtpPages" class="standard-input" placeholder="0"></div>
                        <div><span class="standard-label">Proof Reading (Pgs)</span><input type="number" id="proofPages" class="standard-input" placeholder="0"></div>
                    </div>
                    <label class="checkbox-group"><input type="checkbox" id="publishingPkg" onchange="triggerDebounce()"><span>Full Publishing Package</span></label>
                </div>
            </div>
        </div>
    </form>

    <div class="card inactive" id="invoiceCard">
        <h2 class="card-header" style="border:none; margin-bottom: 8px;">Internal Breakdown</h2>
        <div id="invoiceItems"></div>
    </div>
</div>

<div class="bottom-action-bar">
    <div class="grand-total-row">
        <div class="grand-total-label">Estimated Total</div>
        <div class="grand-total-value" id="grandTotal">₹0</div>
    </div>
    <button id="btnShare" onclick="processOutput()" class="btn-share" disabled>Enter Specs</button>
</div>

<script>
    const DIMENSIONS = { 'A4': { cm: '21 x 28 CM', mm: '210 x 280 MM', in: '8.2 x 11 IN' }, 'A5': { cm: '14 x 21.5 CM', mm: '140 x 215 MM', in: '5.5 x 8.5 IN' }, 'A6': { cm: '10.5 x 7 CM', mm: '105 x 70 MM', in: '4.1 x 2.8 IN' } };
    let currentDimFormat = 'cm', debounceTimer, globalQuoteData = null, currentTotal = 0;

    const A5_RATES = { 
        "70 GSM Natural Shade (NS)": { "Printed": 0.32, "Plain": 0.25 }, "80 GSM Natural Shade (NS)": { "Printed": 0.36, "Plain": 0.27 }, "100 GSM Natural Shade (NS)": { "Printed": 0.38, "Plain": 0.28 }, "120 GSM Natural Shade (NS)": { "Printed": 0.40, "Plain": 0.30 }, 
        "70 GSM Maplitho": { "Printed": 0.32, "Plain": 0.25 }, "80 GSM Maplitho": { "Printed": 0.36, "Plain": 0.27 }, "100 GSM Maplitho": { "Printed": 0.38, "Plain": 0.28 }, "120 GSM Maplitho": { "Printed": 0.40, "Plain": 0.30 } 
    };
    
    const PRICING = {
        colorPages: { "A6": 1.25, "A5": 2.50, "A4": 4.00 }, cover: { "A6": 5.00, "A5": 9.00, "A4": 18.00 },
        binding: { "Centre Stapling": { "A6": 3.00, "A5": 5.00, "A4": 7.00 }, "Perfect Binding": { "A6": 4.00, "A5": 5.00, "A4": 8.00 }, "Spiral Binding": { "A6": 4.00, "A5": 5.00, "A4": 8.00 } },
        hardBindingTiers: [ { max: 100, rate: 140 }, { max: 200, rate: 90 }, { max: 300, rate: 85 }, { max: 1000, rate: 72 } ],
        design: { cover: 2500, inner: { "A6": 175, "A5": 350, "A4": 450 }, basicLayout: 35, dtp: 25, proofing: 30 }, publishing: 3500 
    };

    window.onload = () => { document.querySelectorAll('input, select').forEach(i => i.addEventListener('input', triggerDebounce)); document.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(i => i.addEventListener('change', triggerDebounce)); document.querySelectorAll('input[name="masterSize"]').forEach(i => i.addEventListener('change', updateDimHint)); updateDimHint(); triggerDebounce(); };
    function triggerDebounce() { clearTimeout(debounceTimer); debounceTimer = setTimeout(calculateQuotation, 300); }
    function toggleDrawer(id, isOpen) { document.getElementById(id).classList.toggle('open', isOpen); triggerDebounce(); }
    function resetApp() { document.getElementById('quoteForm').reset(); document.querySelectorAll('.drawer').forEach(d => d.classList.remove('open')); triggerDebounce(); document.getElementById('bookQty').focus(); updateDimHint(); }
    const fmt = (num) => Number.isInteger(num) ? num : num.toFixed(2);
    function toggleDimFormat() { const formats = ['cm', 'mm', 'in']; currentDimFormat = formats[(formats.indexOf(currentDimFormat) + 1) % 3]; document.getElementById('dimFormatBtn').innerText = `Unit: ${currentDimFormat.toUpperCase()}`; updateDimHint(); }
    function updateDimHint() { document.getElementById('sizeHintDisplay').innerText = DIMENSIONS[document.querySelector('input[name="masterSize"]:checked').value][currentDimFormat]; }
    function getVal(id) { let v = parseInt(document.getElementById(id).value); return (isNaN(v) || v < 0) ? 0 : v; }

    function calculateQuotation() {
        const qty = getVal('bookQty'), pages = getVal('innerPages');
        if (qty > 0 && qty < 4) { document.getElementById('btnShare').disabled = true; document.getElementById('btnShare').innerHTML = "MOQ is 4"; globalQuoteData = null; return; }
        if (qty > 1000) { document.body.classList.add('offset-mode'); document.getElementById('grandTotal').innerText = "OFFSET"; document.getElementById('btnShare').innerText = "Contact for Offset"; globalQuoteData = { isOffset: true }; return; }
        if (qty === 0 || pages === 0) { document.getElementById('btnShare').disabled = true; document.getElementById('grandTotal').innerText = "₹0"; globalQuoteData = null; return; }
        
        document.body.classList.remove('offset-mode'); document.getElementById('btnShare').disabled = false; document.getElementById('btnShare').innerText = "Share Quote";
        const size = document.querySelector('input[name="masterSize"]:checked').value, mat = `${document.querySelector('input[name="paperGsm"]:checked').value} GSM ${document.querySelector('input[name="paperType"]:checked').value}`;
        let data = { qty, size, pages, mat, binding: document.querySelector('input[name="bindingStyle"]:checked').value, perBook: { items: [], total: 0 }, totals: { items: [], grandTotal: 0 } };
        
        let rate = A5_RATES[mat][document.querySelector('input[name="printType"]:checked').value];
        let innerRate = (size === "A4") ? rate * 2 : (size === "A6" ? rate / 2 : rate);
        data.perBook.items.push({ name: `Inner Pages (${pages} × ₹${fmt(innerRate)})`, cost: pages * innerRate });
        if (document.getElementById('toggleColour').checked) data.perBook.items.push({ name: `Colour Pages`, cost: getVal('colorPages') * PRICING.colorPages[size] });
        data.perBook.items.push({ name: `Cover Charge`, cost: PRICING.cover[size] });
        
        let bRate = (data.binding === "Hardbinding") ? (PRICING.hardBindingTiers.find(t => qty <= t.max) || {rate: 72}).rate : PRICING.binding[data.binding][size];
        data.perBook.items.push({ name: `Binding: ${data.binding}`, cost: bRate });
        
        data.perBook.total = data.perBook.items.reduce((s, i) => s + i.cost, 0);
        data.totals.items.push({ name: `Production Total`, cost: data.perBook.total * qty });
        let sub = data.totals.items[0].cost;
        if (document.getElementById('toggleDesign').checked) {
            if (document.getElementById('coverDesign').checked) data.totals.items.push({ name: `Cover Design`, cost: PRICING.design.cover }), sub += PRICING.design.cover;
            ['designPages', 'layoutPages', 'dtpPages', 'proofPages'].forEach(id => { let p = getVal(id); if (p > 0) data.totals.items.push({ name: id, cost: p * PRICING.design[id === 'designPages' ? 'inner' : id.replace('Pages','')][size] }), sub += (p * PRICING.design[id === 'designPages' ? 'inner' : id.replace('Pages','')][size]); });
            if (document.getElementById('publishingPkg').checked) data.totals.items.push({ name: `Publishing Pkg`, cost: PRICING.publishing }), sub += PRICING.publishing;
        }
        if (document.getElementById('emergencyCharge').checked) data.totals.items.push({ name: `Emergency Fee`, cost: sub * 0.25 }), sub *= 1.25;
        data.totals.grandTotal = sub; globalQuoteData = data; updateUI();
    }
    function updateUI() {
        const c = document.getElementById('invoiceItems'); c.innerHTML = '';
        globalQuoteData.perBook.items.forEach(i => c.innerHTML += `<div class="invoice-row"><span class="name">${i.name}</span><span class="cost">₹${fmt(i.cost)}</span></div>`);
        c.innerHTML += `<div class="invoice-row" style="margin-top:8px; border-top:1px dashed var(--border); padding-top:8px;"><span class="name">Unit Rate</span><span class="cost">₹${fmt(globalQuoteData.perBook.total)}</span></div>`;
        globalQuoteData.totals.items.forEach(i => c.innerHTML += `<div class="invoice-row"><span class="name">${i.name}</span><span class="cost">₹${fmt(i.cost)}</span></div>`);
        document.getElementById('grandTotal').innerText = `₹${fmt(globalQuoteData.totals.grandTotal)}`;
    }
    function processOutput() {
        if (!globalQuoteData) return;
        const d = globalQuoteData;
        let t = d.isOffset ? `*Team Inspire Bulk Inquiry*\nSize: ${d.masterSize}\nQty: ${d.bookQty}` : `*Team Inspire Quotation*\n\nSize: ${d.masterSize}\nQty: ${d.bookQty}\nPages: ${d.pages}\nPaper: ${d.mat}\nBinding: ${d.binding}\n\n*Per Book Rate: ₹${fmt(d.perBook.total)}/-\*\n*Grand Total: ₹${fmt(d.totals.grandTotal)}/-\*\n\nTerms & Conditions:\n• Work schedule: 3-5 days.\n• 50% advance required.\n• Courier charges extra.\n• Emergency cases: 25% extra.\n• Damage reports within 5 days.\n\nMail: teaminspirepod@gmail.com\nPh: +91 90371 16229`;
        if (navigator.share) navigator.share({ title: 'Quote', text: t }).catch(() => window.open('https://wa.me/?text=' + encodeURIComponent(t)));
        else window.open('https://wa.me/?text=' + encodeURIComponent(t));
    }
</script>
</body>
</html>
