<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Inspire POD - Pro Estimator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-wrapper">
        <div class="container">
            <header>
                <h1>Quote Estimator</h1>
                <p class="subtitle">Dynamic page breakdown & precision calculation engine.</p>
            </header>

            <form id="quoteForm">
                <div class="input-group">
                    <h2>1. Book Specifications</h2>
                    <div class="form-row">
                        <label>Book Size</label>
                        <div class="radio-group">
                            <label><input type="radio" name="masterSize" value="A4" checked> A4 (210x297mm)</label>
                            <label><input type="radio" name="masterSize" value="A5"> A5 (148x210mm)</label>
                            <label><input type="radio" name="masterSize" value="A6"> A6 (105x148mm)</label>
                        </div>
                    </div>
                    <div class="form-row">
                        <label>Quantity (MOQ: 4)</label>
                        <input type="number" id="bookQty" value="50" min="4" max="1000">
                    </div>
                </div>

                <div class="input-group">
                    <h2>2. Interior Paper & Print</h2>
                    <div class="form-row">
                        <label>Print Type (Select all that apply)</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" class="print-type-cb" value="Black & White" checked> Black & White</label>
                            <label><input type="checkbox" class="print-type-cb" value="Multi Color"> Multi Color</label>
                            <label><input type="checkbox" class="print-type-cb" value="Plain (without print)"> Plain (without print)</label>
                        </div>
                    </div>
                    
                    <div id="dynamicPageInputs" class="drawer open"></div>

                    <div class="form-row">
                        <label>Paper Stock</label>
                        <div class="radio-group">
                            <label><input type="radio" name="paperType" value="NS" id="typeNS" checked> Natural Shade / Maplitho</label>
                            <label id="labelTypeArt" class="smooth-hidden"><input type="radio" name="paperType" value="Art Paper" id="typeArt"> Art Paper</label>
                        </div>
                    </div>

                    <div class="form-row">
                        <label>Paper Weight (GSM)</label>
                        <div class="radio-group">
                            <label for="gsm70" id="labelGsm70"><input type="radio" name="paperGsm" value="70" id="gsm70"> 70</label>
                            <label for="gsm80" id="labelGsm80"><input type="radio" name="paperGsm" value="80" id="gsm80" checked> 80</label>
                            <label for="gsm100" id="labelGsm100"><input type="radio" name="paperGsm" value="100" id="gsm100"> 100</label>
                            <label for="gsm120" id="labelGsm120"><input type="radio" name="paperGsm" value="120" id="gsm120"> 120</label>
                            <label for="gsm130" id="labelGsm130" class="smooth-hidden"><input type="radio" name="paperGsm" value="130" id="gsm130"> 130</label>
                            <label for="gsm170" id="labelGsm170" class="smooth-hidden"><input type="radio" name="paperGsm" value="170" id="gsm170"> 170</label>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <h2>3. Exterior & Finish</h2>
                    <div class="form-row">
                        <label>Binding Style</label>
                        <div class="radio-group">
                            <label><input type="radio" name="bindingStyle" value="Perfect Binding" checked> Perfect Binding</label>
                            <label><input type="radio" name="bindingStyle" value="Centre Stapling"> Centre Stapling</label>
                            <label><input type="radio" name="bindingStyle" value="Spiral Binding"> Spiral</label>
                            <label><input type="radio" name="bindingStyle" value="Hardbinding"> Hardbinding</label>
                        </div>
                    </div>

                    <div class="form-row">
                        <label>Cover Stock (GSM)</label>
                        <div class="radio-group">
                            <label for="cover170" id="labelCover170"><input type="radio" name="coverGsm" value="170" id="cover170"> 170</label>
                            <label><input type="radio" name="coverGsm" value="250" id="cover250" checked> 250</label>
                            <label><input type="radio" name="coverGsm" value="300" id="cover300"> 300</label>
                        </div>
                    </div>

                    <div class="form-row">
                        <label>Lamination</label>
                        <div class="radio-group">
                            <label><input type="radio" name="lamination" value="Matte" checked> Matte</label>
                            <label><input type="radio" name="lamination" value="Glossy"> Glossy</label>
                            <label><input type="radio" name="lamination" value="No Lamination"> None</label>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <h2>4. Additional Services</h2>
                    <div class="form-row">
                        <label><input type="checkbox" id="emergencyCharge"> Emergency Priority Service (+35% on Mfg)</label>
                    </div>
                    <div class="form-row">
                        <label><input type="checkbox" id="toggleDesign"> Add Pre-Press & Design Services</label>
                    </div>
                    
                    <div id="designDrawer" class="drawer">
                        <div class="form-row"><label><input type="checkbox" id="coverDesign"> Cover Design (₹2500)</label></div>
                        <div class="form-row"><label><input type="checkbox" id="pubPackage"> Publishing Package (₹3500)</label></div>
                        <div class="form-row"><label>Custom Layout Pages</label><input type="number" id="designPages" placeholder="0" min="0"></div>
                        <div class="form-row"><label>Basic Layout Pages</label><input type="number" id="layoutPages" placeholder="0" min="0"></div>
                        <div class="form-row"><label>DTP Pages</label><input type="number" id="dtpPages" placeholder="0" min="0"></div>
                        <div class="form-row"><label>Proof Reading Pages</label><input type="number" id="proofingPages" placeholder="0" min="0"></div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="sticky-footer-wrapper">
        <div class="sticky-footer-content">
            <div class="total-block">
                <span>Estimated Grand Total</span>
                <div id="grandTotalDisplayDesk" class="hero-total">₹0</div>
            </div>
            
            <div id="bdScrollArea" class="breakdown-area"></div>
            
            <button class="shareActionBtn primary-btn">Generate WhatsApp Quote</button>
        </div>
    </div>
    
    <div id="toast"><span id="toastMsg"></span></div>
    <script src="script.js"></script>
</body>
</html>
