    <style>
        :root { --bg-color: #ffffff; --card-bg: #ffffff; --border: #e2e8f0; --text-main: #111827; --text-muted: #6b7280; --primary: #ef4444; --accent: #111827; --accent-muted: rgba(17, 24, 39, 0.6); }

        .pin-input:focus { border-color: var(--primary); }

        .pin-btn:active { transform: scale(0.98); }

        #appContent { display: none; max-width: 600px; margin: 0 auto; flex-direction: column; gap: 20px; }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        .main-header h1 { font-size: 1.25rem; font-weight: 700; color: var(--text-main); line-height: 1.2; letter-spacing: -0.5px; }

        .card-header { font-size: 1.15rem; font-weight: 700; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
