<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    >

    <title>Team Inspire | Premium Quotation Engine</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOAST -->
    <div id="toast">
        <span id="toastIcon"></span>
        <span id="toastMsg">Message</span>
    </div>

    <!-- APP -->
    <div id="appContainer">

        <!-- INPUT COLUMN -->
        <div class="input-column">

            <header class="main-header">

                <h1>Quotation Engine</h1>

                <button
                    type="button"
                    onclick="resetApp()"
                    class="reset-btn"
                >
                    Reset
                </button>

            </header>

            <form
                id="quoteForm"
                onsubmit="event.preventDefault();"
            >

                <!-- DIMENSIONS -->
                <div class="card">

                    <h2 class="card-header">

                        <div class="card-header-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                            >
                                <rect
                                    x="3"
                                    y="3"
                                    width="18"
                                    height="18"
                                    rx="2"
                                    ry="2"
                                />

                                <line x1="9" y1="3" x2="9" y2="21" />
                            </svg>

                        </div>

                        1. Dimensions

                    </h2>

                    <div class="form-grid">

                        <div>

                            <div class="floating-input">

                                <input
                                    type="number"
                                    id="bookQty"
                                    value="100"
                                    min="0"
                                    max="1000"
                                >

                                <label>Total Quantity</label>

                            </div>

                            <div
                                id="qtyHint"
                                class="dynamic-hint"
                            >
                                MOQ: 4 (Must be a multiple of 4)
                            </div>

                        </div>

                        <div>

                            <div class="title-row">

                                <span class="input-title">
                                    Book Size
                                </span>

                                <button
                                    type="button"
                                    class="dim-toggle"
                                    onclick="toggleDimFormat()"
                                    id="dimFormatBtn"
                                >
                                    Unit: CM
                                </button>

                            </div>

                            <div class="segmented-control">

                                <input
                                    type="radio"
                                    id="sizeA4"
                                    name="masterSize"
                                    value="A4"
                                >

                                <label
                                    for="sizeA4"
                                    class="segment-btn"
                                >
                                    A4
                                </label>

                                <input
                                    type="radio"
                                    id="sizeA5"
                                    name="masterSize"
                                    value="A5"
                                    checked
                                >

                                <label
                                    for="sizeA5"
                                    class="segment-btn"
                                >
                                    A5
                                </label>

                                <input
                                    type="radio"
                                    id="sizeA6"
                                    name="masterSize"
                                    value="A6"
                                >

                                <label
                                    for="sizeA6"
                                    class="segment-btn"
                                >
                                    A6
                                </label>

                            </div>

                            <div
                                class="size-hint"
                                id="sizeHintDisplay"
                            >
                                14.0 × 21.5 CM
                            </div>

                        </div>

                    </div>

                </div>

                <!-- INNER -->
                <div class="card">

                    <h2 class="card-header">

                        <div class="card-header-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                            >
                                <path
                                    d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                                />
                            </svg>

                        </div>

                        2. Inner Core

                    </h2>

                    <div class="form-grid">

                        <!-- PAPER -->
                        <div>

                            <span class="input-title">
                                Text Stock Material
                            </span>

                            <div
                                class="segmented-control"
                                style="margin-bottom: 8px;"
                            >

                                <input
                                    type="radio"
                                    id="typeNS"
                                    name="paperType"
                                    value="Natural Shade"
                                    checked
                                >

                                <label
                                    for="typeNS"
                                    class="segment-btn"
                                >
                                    Natural Shade
                                </label>

                                <input
                                    type="radio"
                                    id="typeMap"
                                    name="paperType"
                                    value="Maplitho White"
                                >

                                <label
                                    for="typeMap"
                                    class="segment-btn"
                                >
                                    Maplitho White
                                </label>

                                <input
                                    type="radio"
                                    id="typeArt"
                                    name="paperType"
                                    value="Art Paper"
                                >

                                <label
                                    for="typeArt"
                                    class="segment-btn smooth-hidden"
                                >
                                    Art Paper
                                </label>

                            </div>

                            <!-- GSM -->
                            <div class="segmented-control">

                                <input
                                    type="radio"
                                    id="gsm70"
                                    name="paperGsm"
                                    value="70"
                                    checked
                                >

                                <label
                                    for="gsm70"
                                    class="segment-btn"
                                >
                                    70 GSM
                                </label>

                                <input
                                    type="radio"
                                    id="gsm80"
                                    name="paperGsm"
                                    value="80"
                                >

                                <label
                                    for="gsm80"
                                    class="segment-btn"
                                >
                                    80 GSM
                                </label>

                                <input
                                    type="radio"
                                    id="gsm100"
                                    name="paperGsm"
                                    value="100"
                                >

                                <label
                                    for="gsm100"
                                    class="segment-btn"
                                >
                                    100 GSM
                                </label>

                                <input
                                    type="radio"
                                    id="gsm120"
                                    name="paperGsm"
                                    value="120"
                                >

                                <label
                                    for="gsm120"
                                    class="segment-btn"
                                >
                                    120 GSM
                                </label>

                                <input
                                    type="radio"
                                    id="gsm130"
                                    name="paperGsm"
                                    value="130"
                                >

                                <label
                                    for="gsm130"
                                    class="segment-btn smooth-hidden"
                                >
                                    130 GSM
                                </label>

                                <input
                                    type="radio"
                                    id="gsm170"
                                    name="paperGsm"
                                    value="170"
                                >

                                <label
                                    for="gsm170"
                                    class="segment-btn smooth-hidden"
                                >
                                    170 GSM
                                </label>

                            </div>

                        </div>

                        <!-- PRINT TYPES -->
                        <div>

                            <span class="input-title">
                                Printing Type
                            </span>

                            <div class="checkbox-stack">

                                <label class="checkbox-group">

                                    <input
                                        type="checkbox"
                                        class="print-type-cb"
                                        value="Black & White"
                                        checked
                                    >

                                    <span class="checkbox-custom"></span>

                                    <span class="label-text">
                                        Black & White
                                    </span>

                                </label>

                                <label class="checkbox-group">

                                    <input
                                        type="checkbox"
                                        class="print-type-cb"
                                        value="Multi Color"
                                    >

                                    <span class="checkbox-custom"></span>

                                    <span class="label-text">
                                        Multi Color
                                    </span>

                                </label>

                                <label class="checkbox-group">

                                    <input
                                        type="checkbox"
                                        class="print-type-cb"
                                        value="Plain (without print)"
                                    >

                                    <span class="checkbox-custom"></span>

                                    <span class="label-text">
                                        Plain (without print)
                                    </span>

                                </label>

                            </div>

                            <!-- PAGE BREAKDOWN -->
                            <div class="inner-breakdown-box">

                                <span class="input-title primary">
                                    Page Breakdown
                                </span>

                                <div id="printInputsContainer"></div>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- EXTERIOR -->
                <div class="card">

                    <h2 class="card-header">

                        <div class="card-header-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                            >
                                <polygon
                                    points="12 2 2 7 12 12 22 7 12 2"
                                />
                            </svg>

                        </div>

                        3. Exterior Layer

                    </h2>

                    <div class="form-grid">

                        <!-- BINDING -->
                        <div>

                            <span class="input-title">
                                Binding
                            </span>

                            <div class="radio-inline-group">

                                <label class="radio-label">

                                    <input
                                        type="radio"
                                        name="bindingStyle"
                                        value="Perfect Binding"
                                        checked
                                    >

                                    <span class="radio-custom"></span>

                                    Perfect Binding

                                </label>

                                <label class="radio-label">

                                    <input
                                        type="radio"
                                        name="bindingStyle"
                                        value="Spiral Binding"
                                    >

                                    <span class="radio-custom"></span>

                                    Spiral Binding

                                </label>

                                <label class="radio-label">

                                    <input
                                        type="radio"
                                        name="bindingStyle"
                                        value="Centre Stapling"
                                    >

                                    <span class="radio-custom"></span>

                                    Centre Stapling

                                </label>

                                <label class="radio-label">

                                    <input
                                        type="radio"
                                        name="bindingStyle"
                                        value="Hard Binding"
                                    >

                                    <span class="radio-custom"></span>

                                    Hard Binding

                                </label>

                            </div>

                        </div>

                    </div>

                </div>

            </form>

        </div>

        <!-- BREAKDOWN -->
        <div class="breakdown-column">

            <div class="breakdown-card">

                <div class="breakdown-title">
                    INTERNAL BREAKDOWN
                </div>

                <div
                    class="breakdown-scroll"
                    id="bdScrollArea"
                ></div>

                <div class="grand-total-container">

                    <span class="grand-total-label">
                        Estimated Grand Total
                    </span>

                    <span
                        class="grand-total-value"
                        id="grandTotalDisplayMob"
                    >
                        —
                    </span>

                </div>

                <button class="btn-share shareActionBtn">

                    <span class="btn-text">
                        Generate Quote
                    </span>

                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

  </html>
